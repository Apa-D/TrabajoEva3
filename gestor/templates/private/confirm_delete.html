{% extends 'default.html' %}
{% block title %}Confirmar Borrado{% endblock %}
{% block content %}
<h2>¿Estás seguro?</h2>
<p>Estás a punto de borrar permanentemente: <strong>"{{ object }}"</strong>.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, borrar</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">No, cancelar</a>
</form>
{% endblock %}
